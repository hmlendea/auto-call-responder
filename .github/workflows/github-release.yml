name: GitHub Release

on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repository
      uses: actions/checkout@v7

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Extract the version from the GitHub tag
      id: version
      run: |
        VERSION="${{ github.event.release.tag_name }}"
        VERSION="${VERSION#v}"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Build the release artefact
      run: ./gradlew clean assembleRelease --no-daemon

    - name: Name the release artefact
      run: |
        mv app/build/outputs/apk/release/app-release-unsigned.apk "AutoCallResponder_v${{ steps.version.outputs.version }}_unsigned.apk"

    - name: Publish the release asset
      uses: softprops/action-gh-release@v2
      with:
        files: AutoCallResponder_v*_unsigned.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}